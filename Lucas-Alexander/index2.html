<html lang="en">
<head>
    <title> Cookie Clicker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div style="display: flex; gap: 40px; padding: 40px;">
        
        <div style="display: flex; flex-direction: column; align-items: center; width: 400px;">
            
            <div style="height: 120px; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                <h1 id="count-display" style="display: inline-block; background-color: rgba(64, 64, 64, 0.6); padding: 8px; margin: 0; white-space: nowrap;">0 cookies</h1>
                <p id="per-second-display" style="margin: 8px 0 0 0; white-space: nowrap;">per second: 0</p>
            </div>

            <div style="position: relative; width: 400px; height: 400px;">
                <img src="shine.jpg" alt="Shine" width="400" height="400" class="shine" style="position: absolute; top: 0; left: 0; z-index: 1;" />
                <img src="cookie.jpg" alt="Cookie" width="200" height="200" onclick="clickCookie()" class="cookie" style="position: absolute; top: 100px; left: 100px; z-index: 2; cursor: pointer;" />
            </div>
        </div>

        <div style="display: flex; flex-direction: column; justify-content: center;">
            <button type="button" onclick="buyBuilding('cursor')" style="margin: 8px 0; padding: 10px 20px;">
                buy a cursor (10 cookies)
            </button>

            <button type="button" onclick="buyBuilding('grandma')" style="margin: 8px 0; padding: 10px 20px;">
                hire a grandma (100 cookies)
            </button>

            <button type="button" onclick="buyBuilding('farm')" style="margin: 8px 0; padding: 10px 20px;">
                buy a farm (1100 cookies)
            </button>

            <button type="button" onclick="buyBuilding('mine')" style="margin: 8px 0; padding: 10px 20px;">
                buy a mine (12000 cookies)
            </button>

            <button type="button" onclick="buyBuilding('factory')" style="margin: 8px 0; padding: 10px 20px;">
                buy a factory (130000 cookies)
            </button>

            <button type="button" onclick="buyBuilding('bank')" style="margin: 8px 0; padding: 10px 20px;">
                buy a bank (1.4 million cookies)
            </button>
        </div>

    </div>
</body>
</html>
