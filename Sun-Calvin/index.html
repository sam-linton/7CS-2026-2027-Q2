<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="title" class="info">
        <h1>Target Practice</h1>
    </div>
    <div id="score">
        <h1>Score: 0</h1>
    </div>
    <div id="time">
        <h1>Time: 20</h1>
    </div>

    <div id="targets">
        <h1 id="start" onclick="startGame()">Click to start</h1>
    </div>
    <div id="howToPlay" class="info">
        <h2>Click the target</h2>
        <h3>The closer you get to the center, the more points you get</h3>
        <h4>You have 20 seconds to get as many targets as you can, Good Luck!</h4>
    </div>
</body>

</html>
