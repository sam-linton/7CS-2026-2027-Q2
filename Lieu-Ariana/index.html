<!DOCTYPE html>
<html lang="en">
<head>
    <title>art gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="herotab">
        <h1> dinos for sale:
    </div>

    <div class="gallery">
        
        <div class="card">
            <img src="popsicle.jpg" alt="">
            <h1>popsicle dino</h1>
            <p>
                on sale: $150
            </p>
            <button onclick="buttonPressed()">buy now!</button>
        </div>

        <div class="card">
            <img src="ice.jpg" alt="">
            <h1>iced dino</h1>
            <p>
                on sale: $100
            </p>
            <button onclick="buttonPressed()">buy now!</button>
        </div>

        <div class="card">
            <img src="hamster.jpg" alt="">
            <h1>hamster + dino</h1>
            <p>
                on sale: $200
            </p>
            <button onclick="buttonPressed()">buy now!</button>
        </div>

        <div class="card">
            <img src="pencil.jpg" alt="">
            <h1>pencil holder dino</h1>
            <p>
                on sale: $50
            </p>
            <button onclick="buttonPressed()">buy now!</button>
        </div>

        <div class="card">
            <img src="music.jpg" alt="">
            <h1>headphone set + dino</h1>
            <p>
                on sale: $300
            </p>
            <button onclick="buttonPressed()">buy now!</button>
        </div>

        <div class="card">
            <img src="tennisball.jpg" alt="">
            <h1>tennis ball bed dino</h1>
            <p>
                on sale: $300
            </p>
            <button onclick="buttonPressed()">buy now!</button>
        </div>

    </div>
</body>
