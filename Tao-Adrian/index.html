<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="box">
        <h1 class="name">Timer because why not</h1>

        <input type="number" id="hr" value="0" min="0" class="values"> Hr . 
        <input type="number" id="min" value="0" min="0" max="59" class="values"> Min . 
        <input type="number" id="sec" value="0" min="0" max="59" class="values"> Sec
        <br><br>

        <div class="buttons">
            <button onclick="startTimer()" class="start">Start</button>
            <button onclick="cancelTimer()" class="cancel">Cancel</button>
        </div>



        <h2 id="timerDisplay" class="timeleft">0.00.00</h2>
        <p id="warning"> </p>
    </div>

    <script src="timer.js"></script>
</body>
</html>
